<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>og card</title>
  <style>
    @font-face {
      font-family: "Playfair Display";
      src: url("fonts/PlayfairDisplay-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Playfair Display";
      src: url("fonts/PlayfairDisplay-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "Playfair Display";
      src: url("fonts/PlayfairDisplay-700.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Playfair Display";
      src: url("fonts/PlayfairDisplay-500i.ttf") format("truetype");
      font-weight: 500;
      font-style: italic;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("fonts/SourceSans3-400.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("fonts/SourceSans3-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("fonts/SourceSans3-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #0e0f0c; }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 72% 64% at 50% 46%, rgba(212, 168, 75, 0.07) 0%, rgba(14, 15, 12, 0) 58%),
        radial-gradient(ellipse 90% 80% at 50% 100%, rgba(42, 48, 28, 0.45) 0%, rgba(14, 15, 12, 0) 55%),
        linear-gradient(180deg, #12140f 0%, #0e0f0c 42%, #0b0c0a 100%);
      color: #eceae3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92  0 0 0 0 0.9  0 0 0 0 0.78  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 74% 70% at 50% 48%, rgba(14,15,12,0) 40%, rgba(8,9,6,0.55) 100%);
    }

    .frame {
      position: absolute;
      inset: 36px;
      border: 1px solid rgba(212, 168, 75, 0.22);
      pointer-events: none;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(236, 234, 227, 0.06);
    }

    .lockup {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 780px;
    }

    .kicker {
      font-family: "Source Sans 3", sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: #d4a84b;
      margin-bottom: 28px;
    }

    .name {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-size: 68px;
      line-height: 0.98;
      letter-spacing: 0.035em;
      color: #eceae3;
      font-kerning: normal;
    }

    .name .line {
      display: block;
    }

    .name .line.primary {
      font-size: 72px;
      letter-spacing: 0.05em;
    }

    .name .line.family {
      font-size: 72px;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      margin-top: 6px;
    }

    .rule {
      width: 112px;
      height: 1.5px;
      margin: 28px 0 22px;
      background: #d4a84b;
      box-shadow: 0 0 18px rgba(212, 168, 75, 0.35);
    }

    .subtitle {
      font-family: "Source Sans 3", sans-serif;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 0.16em;
      text-indent: 0.08em;
      color: #eceae3;
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="frame"></div>
    <div class="lockup">
      <div class="kicker">Portfolio</div>
      <h1 class="name">
        <span class="line primary">Mueez Ul</span>
        <span class="line family">Rehman</span>
      </h1>
      <div class="rule"></div>
      <p class="subtitle">Laravel & PHP Full-Stack Developer</p>
    </div>
  </div>
</body>
</html>
